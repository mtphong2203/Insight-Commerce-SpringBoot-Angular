<form
  [formGroup]="formLogin"
  (ngSubmit)="onSubmit()"
  class="p-4 bg-white rounded-md"
>
  <h1 class="text-2xl text-center mb-2">Login</h1>
  <div class="form-group mb-2">
    <label for="username">Username</label>
    <input
      type="text"
      formControlName="username"
      id="username"
      placeholder="Enter user name"
      class="p-2 rounded-sm w-full border border-slate-700 focus:outline-blue-600"
    />
  </div>
  <div class="form-group mb-2">
    <label for="password">Password</label>
    <input
      type="password"
      formControlName="password"
      id="password"
      placeholder="Enter password"
      class="p-2 rounded-sm w-full border border-slate-700 focus:outline-blue-600"
    />
  </div>
  <button
    type="submit"
    class="w-full border border-slate-400 focus:outline-none rounded-sm mt-2 p-2 bg-blue-500 text-white hover:bg-blue-700"
  >
    Login
  </button>
</form>
