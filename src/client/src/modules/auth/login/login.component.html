<form
  [formGroup]="formLogin"
  (ngSubmit)="onSubmit()"
  class="bg-slate-50 p-4 rounded-md"
>
  <h1 class="text-2xl text-center mb-2">Login</h1>
  <div class="form-group mb-2">
    <label for="username">Username</label>
    <input
      type="text"
      formControlName="username"
      id="username"
      class="p-2 rounded-sm w-full"
    />
  </div>
  <div class="form-group mb-2">
    <label for="password">Password</label>
    <input
      type="password"
      formControlName="password"
      id="password"
      class="p-2 rounded-sm w-full"
    />
  </div>
  <button
    type="submit"
    class="w-full rounded-sm mt-2 p-2 bg-blue-500 text-white hover:bg-blue-700"
  >
    Login
  </button>
</form>
