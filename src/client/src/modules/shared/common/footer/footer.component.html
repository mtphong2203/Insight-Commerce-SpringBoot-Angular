<footer class="bg-slate-50">
  <div class="contain w-[80%] m-auto">
    <!-- Content -->
    <div class="content border-b border-slate-500 text-center py-2">
      <p>&copy; {{ currentYear }} E-Shop. All rights reserved.</p>
    </div>
    <!-- Privacy policy -->
    <div class="privacy flex justify-between py-2">
      <div class="policy">
        <h2 class="text-xl font-medium">Privacy Policy</h2>
        <p class="flex flex-col">
          <span>Information Collection</span>
          <span>Use of Information</span>
          <span>Information Protection</span>
          <span>Customer Rights</span>
        </p>
      </div>
      <div class="terms">
        <h2 class="text-xl font-medium">Terms of use</h2>
        <p class="flex flex-col">
          <span>Acceptance of Terms</span>
          <span>Purchasing & Payment</span>
          <span>Return & Exchange Policy</span>
          <span>Changes to Terms</span>
        </p>
      </div>
      <div class="contact">
        <h2 class="text-xl font-medium">How to contact</h2>
        <div class="contact-control flex gap-4">
          <a [routerLink]="['/']" class="contact-link">
            <fa-icon
              [icon]="facebookIcon"
              class="text-3xl text-blue-500"
            ></fa-icon>
          </a>
          <a [routerLink]="['/']" class="contact-link">
            <fa-icon
              [icon]="youtubeIcon"
              class="text-3xl text-red-500"
            ></fa-icon>
          </a>
          <a [routerLink]="['/']" class="contact-link">
            <fa-icon [icon]="tikTokIcon" class="text-3xl"></fa-icon>
          </a>
        </div>
      </div>
    </div>
  </div>
</footer>
